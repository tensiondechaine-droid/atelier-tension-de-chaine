name: Construire l'APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer Capacitor
        run: npm install

      - name: Créer le projet Android
        run: npx cap add android

      - name: Générer les icônes
        run: npx @capacitor/assets generate --android || echo "Icônes par défaut"

      - name: Copier l'app dans le projet Android
        run: npx cap sync android

      - name: Construire l'APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Mettre l'APK à disposition
        uses: actions/upload-artifact@v4
        with:
          name: atelier-tension-de-chaine-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
